spring:
  application:
    name: uniondesk
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  datasource:
    url: jdbc:mysql://127.0.0.1:30306/uniondesk?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: uniondesk_app
    password: gq0fd2sqOCncrNp3eBeGuLty
  data:
    redis:
      # 在线咨询排队/在线状态热路径；密码必须经环境变量注入，禁止写源码字面量
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:30379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3s}
    hikari:
      # 连接池配置 - 修复连接失效问题
      maximum-pool-size: 20
      minimum-idle: 5
      # 连接最大存活时间（毫秒）- 应小于 MySQL wait_timeout（默认 8 小时 = 28800000ms）
      max-lifetime: 1800000
      # 连接空闲超时（毫秒）
      idle-timeout: 600000
      # 连接超时（毫秒）
      connection-timeout: 30000
      # 连接测试查询
      connection-test-query: SELECT 1
      # 自动提交
      auto-commit: true
  flyway:
    enabled: true
    validate-on-migrate: false
    locations: classpath:db/migration/current
    # 修复模式：跳过失败的迁移（开发环境使用）
    # 生产环境请勿使用此配置
    repair-on-migrate: true
  profiles:
    include: demo

mybatis-flex:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

uniondesk:
  security:
    jwt:
      issuer: uniondesk
      secret: uniondesk-demo-jwt-secret-please-change-me
      access-token-ttl: PT24H
      refresh-token-ttl: P7D
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:30090}
    access-key: ${MINIO_ACCESS_KEY:comm_minio}
    secret-key: ${MINIO_SECRET_KEY:Ck3LnjpLGY2aGhyIu2OoMAFd}
    bucket: ${MINIO_BUCKET:uniondesk-attachments}
    region: us-east-1
    presign-expiry-seconds: 300
